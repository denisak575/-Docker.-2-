version: '3'
volumes:
    prometheus_data: {}
    grafana_data: {}
services:
  prometheus:
    restart: on-failure
    depends_on:
      - pushgateway
    image: prom/prometheus:latest
    container_name: Kuznetsov-DS-netology-prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - Kuznetsov-DS-my-netology-hw  
  pushgateway:
    restart: on-failure
    image: prom/pushgateway:latest
    container_name: Kuznetsov-DS-netology-pushgateway
    ports:
      - 9091:9091
    networks:
      - Kuznetsov-DS-my-netology-hw  
  grafana:
    restart: on-failure
    depends_on:
      - prometheus
    image: grafana/grafana
    container_name: Kuznetsov-DS-netology-grafana
    ports:
      - 80:3000
    environment:
      - GF_PATHS_CONFIG=/etc/grafana/custom.ini
    volumes:
      - grafana_data:/var/lib/grafana
      - ./custom.ini:/etc/grafana/custom.ini
    networks:
      - Kuznetsov-DS-my-netology-hw   
networks: 
  Kuznetsov-DS-my-netology-hw:    
    ipam:
      config:
        - subnet: 10.5.0.0/16
