version: '3'
services:
  pushgateway:
    image: prom/pushgateway:latest
    container_name: Kuznetsov-DS-netology-pushgateway
    ports:
      - 9091:9091
    networks:
      - Kuznetsov-DS-netology-pushgateway  
networks: 
  Kuznetsov-DS-netology-pushgateway:    
    ipam:
      config:
        - subnet: 10.5.0.0/16
 