version: '3'
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: Kuznetsov-DS-netology-prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - Kuznetsov-DS-my-netology-hw   
networks: 
  Kuznetsov-DS-my-netology-hw:    
    ipam:
      config:
        - subnet: 10.5.0.0/16
